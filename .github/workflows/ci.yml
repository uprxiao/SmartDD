name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  workflow-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check tracked paths for Windows checkout
        run: node scripts/release/check-checkout-paths.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
  checks:
    needs: workflow-check
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Install loopback database test drivers
        run: python -m pip install -r scripts/release/requirements-ci.txt
      - run: pnpm typecheck
      - run: pnpm test:release
      - run: pnpm test
      - run: pnpm build
