name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  workflow-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
  checks:
    needs: workflow-check
    runs-on: macos-latest
    # Includes the full native-process/IO suite and the subsequent application build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Install loopback database test drivers
        run: python -m pip install -r scripts/release/requirements-ci.txt
      - run: pnpm typecheck
      - run: pnpm test:release
      - name: Prepare immutable application bundles and native test helpers
        run: pnpm test:prepare
      - run: pnpm test --maxWorkers=2
      - run: pnpm build
