:root.ylight {
  --bg: #fff;
  --sidebar: #f5f5f5;
  --surface: #fafafa;
  --hover: #ebebeb;
  --selected: #e8e8e8;
  --text: #292929;
  --secondary: #707070;
  --muted: #909090;
  --border: #e9e9e9;
  --border-strong: #d8d8d8;
  --primary: #242424;
  --on-primary: #fff;
  --success: #27864b;
  --success-bg: #edf6ee;
}

:root.ydark {
  --bg: #181818;
  --sidebar: #202020;
  --surface: #222;
  --hover: #303030;
  --selected: #333;
  --text: #e9e9e9;
  --secondary: #a1a1a1;
  --muted: #777;
  --border: #303030;
  --border-strong: #444;
  --primary: #e9e9e9;
  --on-primary: #1b1b1b;
  --success: #80c296;
  --success-bg: #203028;
}

:root.ylight, :root.ydark {
  --background: var(--bg);
  --background-1: var(--sidebar);
  --background-2: var(--selected);
  --background-3: var(--hover);
  --foreground: var(--text);
  --foreground-muted: var(--secondary);
  --foreground-passive: var(--muted);
  --primary-button-background: var(--primary);
  --primary-button-foreground: var(--on-primary);
  --primary-button-background-hover: var(--secondary);
  --mono: "SFMono-Regular","SF Mono",Menlo,Consolas,monospace;
}

body {
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  font-weight: 430;
}

.app {
  height: 100dvh;
  display: flex;
}

.sidebar {
  width: var(--sidebar-width);
  flex: 0 0 var(--sidebar-width);
  background: var(--sidebar);
  flex-direction: column;
  padding: 0 10px;
  display: flex;
  position: relative;
}

.sidebar-top {
  flex-shrink: 0;
  justify-content: space-between;
  align-items: center;
  height: 62px;
  padding: 0 9px;
  display: flex;
}

.brand {
  letter-spacing: -.2px;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  display: flex;
}

.brand img {
  border-radius: 7px;
  width: 25px;
  height: 25px;
}

.icon-button {
  width: 29px;
  height: 29px;
  color: var(--secondary);
  border-radius: 7px;
  flex-shrink: 0;
  justify-content: center;
  align-items: center;
  display: inline-flex;
}

.icon-button:hover {
  background: var(--hover);
  color: var(--text);
}

.primary-nav {
  flex-direction: column;
  gap: 3px;
  padding: 3px 0 24px;
  display: flex;
}

.nav-row {
  text-align: left;
  width: 100%;
  height: 36px;
  color: var(--text);
  white-space: nowrap;
  border-radius: 8px;
  align-items: center;
  gap: 10px;
  padding: 0 11px;
  font-size: 13px;
  display: flex;
}

.nav-row svg {
  color: var(--secondary);
  stroke-width: 1.6px;
}

.nav-row kbd {
  opacity: 0;
  margin-left: auto;
  transition: opacity .15s;
}

.nav-row:hover kbd, .nav-row:focus-visible kbd {
  opacity: 1;
}

.nav-row:hover, .project-row:hover, .task-row:hover {
  background: var(--hover);
}

.selected {
  background: var(--selected) !important;
}

.sidebar-scroll {
  scrollbar-width: thin;
  flex: 1;
  min-height: 0;
  overflow: hidden auto;
}

.section-heading {
  color: var(--secondary);
  justify-content: space-between;
  align-items: center;
  min-height: 30px;
  padding: 0 10px;
  font-size: 12px;
  font-weight: 500;
  display: flex;
}

.section-heading .icon-button {
  width: 23px;
  height: 23px;
}

.project-group {
  margin-bottom: 16px;
}

.project-row {
  border-radius: 8px;
  align-items: center;
  min-height: 33px;
  padding: 0 4px;
  display: flex;
}

.project-chevron {
  width: 18px;
  height: 29px;
  color: var(--secondary);
  align-items: center;
  display: flex;
}

.project-name {
  text-align: left;
  flex: 1;
  align-items: center;
  gap: 7px;
  min-width: 0;
  height: 33px;
  font-size: 13px;
  font-weight: 500;
  display: flex;
}

.project-name svg {
  color: var(--secondary);
}

.project-name span {
  text-overflow: ellipsis;
  overflow: hidden;
}

.reveal {
  opacity: 0;
}

.project-row:hover .reveal, .reveal:focus-visible {
  opacity: 1;
}

.project-tasks {
  padding-top: 2px;
}

.task-row {
  text-align: left;
  border-radius: 8px;
  align-items: center;
  gap: 6px;
  width: 100%;
  min-height: 35px;
  padding: 8px 10px 8px 30px;
  font-size: 12px;
  line-height: 18px;
  display: flex;
}

.task-title {
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
  overflow: hidden;
}

.task-time {
  color: var(--muted);
  white-space: nowrap;
  font-size: 10px;
}

.running-dot, .status-dot, .tiny-dot {
  background: var(--success);
  border-radius: 50%;
  flex-shrink: 0;
  width: 6px;
  height: 6px;
  display: inline-block;
}

.running-dot {
  width: 5px;
  height: 5px;
  margin: 0 3px 0 7px;
}

.sidebar-empty {
  color: var(--muted);
  padding: 8px 30px;
  font-size: 12px;
}

.sidebar-bottom {
  flex-shrink: 0;
  padding: 10px 0 16px;
}

.sidebar-footnote {
  color: var(--muted);
  align-items: center;
  gap: 6px;
  padding: 10px 11px 0;
  font-size: 10px;
  display: flex;
}

.sidebar-footnote .tiny-dot {
  background: var(--muted);
  width: 2px;
  height: 2px;
}

.sidebar-resizer {
  z-index: 5;
  cursor: col-resize;
  flex: 0 0 4px;
  width: 4px;
  margin-right: -4px;
  transition: background .15s;
}

.sidebar-resizer:hover {
  background: var(--border-strong);
}

.sidebar-collapsed .sidebar {
  flex-basis: 58px;
  width: 58px;
  padding: 0 8px;
}

.sidebar-collapsed .sidebar-top {
  justify-content: center;
  padding: 0;
}

.sidebar-collapsed .brand, .sidebar-collapsed .nav-row span, .sidebar-collapsed .nav-row kbd {
  display: none;
}

.sidebar-collapsed .nav-row {
  justify-content: center;
  height: 38px;
  padding: 0;
}

.sidebar-collapsed .sidebar-bottom {
  margin-top: auto;

  color: var(--secondary);
  border-radius: 8px;
  margin-top: 20px;
  padding: 12px;
  font-size: 11px;
  line-height: 1.8;
}

.import-option {
  align-items: center;
  gap: 14px;
  padding: 15px 0;
  display: flex;
}

.import-option p {
  color: var(--secondary);
  margin-top: 4px;
  font-size: 11px;
  line-height: 1.8;
}

.preview-description {
  color: var(--secondary);
  font-size: 12px;
  line-height: 1.9;
}

.preview-description p {
  margin-bottom: 14px;
}

.toast {
  z-index: 100;
  border: 1px solid var(--border);
  max-width: calc(100vw - 50px);
  box-shadow: var(--shadow);
  background: var(--bg);
  color: var(--text);
  border-radius: 11px;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  font-size: 12px;
  display: flex;
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
}

.toast > svg {
  color: var(--success);
}

.toast button {
  color: var(--muted);
  margin-left: 8px;
  display: flex;
}

.spin {
  animation: 1s linear infinite spin;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 1150px) {
  .settings-shell {
    gap: 25px;
    padding: 22px 20px 0;
  }

  .settings-nav {
    flex-basis: 132px;
  }

  .settings-content {
    padding-right: 0;
  }

  .home {
    width: min(680px, 100% - 56px);
  }

  .profile-row {
    gap: 7px;
  }

  .profile-symbol {
    display: none;
  }

  .detection-list {
    padding: 0 12px;
  }

  .setting-row {
    flex-wrap: wrap;
    gap: 12px;
  }

  .setting-control {
    margin-left: auto;
  }
}

@media (max-width: 900px) {
  .sidebar {
    flex-basis: 230px;
    width: 230px;
  }

  .sidebar-resizer {
    display: none;
  }

  .topbar {
    padding: 0 18px;
  }

  .home {
    width: calc(100% - 40px);
    padding-top: 28px;
  }

  .home-heading h1 {
    font-size: 25px;
  }

  .suggestions {
    gap: 7px;
  }

  .suggestions button {
    padding: 12px 8px;
    font-size: 10px;
  }

  .suggestion-arrow {
    display: none;
  }

  .settings-shell {
    flex-direction: column;
    gap: 24px;
    padding: 10px 18px 0;
  }

  .settings-nav {
    border-bottom: 1px solid var(--border);
    flex: none;
    gap: 3px;
    padding-top: 0;
    padding-bottom: 9px;
    display: flex;
    overflow-x: auto;
  }

  .settings-nav h2 {
    display: none;
  }

  .settings-nav .nav-row {
    gap: 5px;
    width: auto;
    margin: 0;
    padding: 0 10px;
    font-size: 11px;
  }

  .settings-content {
    padding-top: 0;
  }

  .page-heading {
    margin-bottom: 26px;
  }

  .page-heading h1 {
    font-size: 22px;
  }

  .page-heading p {
    font-size: 11px;
  }

  .profile-row {
    flex-wrap: wrap;
  }

  .profile-main {
    min-width: 140px;
  }

  .detection-info code {
    font-size: 9px;
  }

  .detection-row {
    gap: 8px;
  }

  .tool-icon {
    width: 30px;
    height: 30px;
  }

  .project-page {
    padding: 23px 22px 40px;
  }

  .project-summary {
    gap: 8px;
  }

  .project-summary > div {
    gap: 7px;
    padding: 14px 10px;
    font-size: 11px;
  }

  .task-context {
    margin: 0 18px;
  }

  .task-context .subtle {
    display: none;
  }

  .terminal-stage {
    padding: 20px 18px 10px;
  }

  .task-statusbar {
    gap: 10px;
    padding: 0 18px;
  }

  .composer-caption > span:last-child {
    max-width: 145px;
  }

  .picker {
    max-width: 160px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, :before, :after {
    transition: none !important;
    animation: none !important;
  }
}

:root {
  --app-frame: #f5f5f5;
  --rail-muted: #8a8d8e;
  --rail-foreground: #202424;
  --rail-selected: #e9e9e9;
  --rail-hover: #ededed;
  --rail-line: #dedede;
  --settings-nav: #f5f5f5;
  --settings-card: #f8f8f8;
  --settings-line: #e4e4e4;
  --settings-search: #e8e9e9;
  --settings-selected: #e4e5e5;
  --accent: #3385ff;
}

:root.ydark {
  --app-frame: #262626;
  --rail-muted: #8f9293;
  --rail-foreground: #f1f1f1;
  --rail-selected: #363636;
  --rail-hover: #303030;
  --rail-line: #393939;
  --settings-nav: #1e2022;
  --settings-card: #232323;
  --settings-line: #353535;
  --settings-search: #303233;
  --settings-selected: #303233;
  --text: #f1f1f1;
  --secondary: #a3a3a3;
  --muted: #8b8f91;
}

.codex-frame {
  background: var(--app-frame);
  padding: 44px 4px 4px 52px;
  position: relative;
}

.codex-frame > .workspace {
  border-radius: 0 12px 12px 0;
}

.codex-frame > .sidebar {
  border-radius: 12px 0 0 12px;
}

.window-navigation {
  gap: 5px;
  height: 30px;
  display: flex;
  position: absolute;
  top: 6px;
  left: 7px;
}

.window-navigation .icon-button {
  color: #949da1;
  width: 30px;
  height: 30px;
}

.window-navigation .icon-button svg {
  width: 16px;
  height: 16px;
}

.app-rail {
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  width: 52px;
  padding: 8px 0 6px;
  display: flex;
  position: absolute;
  top: 44px;
  bottom: 4px;
  left: 0;
}

.rail-links, .rail-bottom {
  flex-direction: column;
  align-items: center;
  gap: 12px;
  display: flex;
}

.app-rail .icon-button {
  color: #969fa2;
  border-radius: 8px;
  width: 32px;
  height: 32px;
  position: relative;
}

.app-rail .icon-button svg {
  stroke-width: 1.7px;
  width: 19px;
  height: 19px;
}

.app-rail .icon-button:hover {
  color: #e5e8e9;
  background: #ffffff0a;
}

.rail-active:after {
  content: "";
  background: #3385ff;
  border-radius: 50%;
  width: 7px;
  height: 7px;
  position: absolute;
  top: 4px;
  right: 4px;
}

.rail-separator {
  background: #ffffff12;
  width: 24px;
  height: 1px;
  margin: -2px 0;
}

.rail-bottom {
  gap: 20px;
}

.app-rail .rail-download {

  background: #3385ff;
  border-radius: 50%;
  width: 24px;
  height: 24px;
}

.app-rail .rail-download svg {
  width: 15px;
  height: 15px;
}

.rail-avatar {
  border-radius: 8px;
  width: 32px;
  height: 32px;
}

.rail-avatar img {
  object-fit: contain;
  width: 100%;
  height: 100%;

}

.settings-mode > .sidebar, .settings-mode > .sidebar-resizer, .settings-mode .topbar {
  display: none;
}

.settings-mode > .workspace {

}

.settings-mode .settings-shell {

  gap: 0;
  padding: 0;
  display: flex;
}

.settings-mode .settings-nav {
  background: var(--settings-nav);
  border-right: 1px solid var(--text);
  flex: 0 0 240px;
  width: 240px;
}

@supports (color: color-mix(in lab, red, red)) {
  .settings-mode .settings-nav {
    border-right: 1px solid color-mix(in srgb, var(--text) 8%, transparent);
  }
}

.settings-mode .settings-nav {

  gap: 0;
  padding: 14px 8px 0;
  display: flex;
  overflow: hidden;
}

.settings-mode .settings-nav > h2 {

  padding: 0;
  font-size: 18px;
  font-weight: 600;
  line-height: 24px;

}

.settings-search {
  background: var(--settings-search);
  height: 36px;
  min-height: 36px;
  color: var(--secondary);
  border-radius: 22px;
  align-items: center;
  gap: 8px;

}

.settings-search input {

.settings-search:focus-within {

.settings-nav-scroll {

}

.settings-nav-group {

}

.settings-nav-group h3 {

  font-weight: 400;
  line-height: 20px;
}

.settings-mode .settings-nav .nav-row {

  height: 30px;
  min-height: 30px;
  margin: 1px 0;
  padding: 0 8px;
  font-size: 14px;
  font-weight: 400;
  line-height: 22px;
}

.settings-mode .settings-nav .nav-row svg {
  color: var(--text);
  width: 17px;
  height: 17px;
}

.settings-mode .settings-nav .selected {

}

.settings-mode .settings-nav .nav-row:hover {
  background: var(--settings-selected);
}

.settings-search-empty {
  color: var(--muted);
  padding: 20px 8px;
  font-size: 13px;
}

.settings-mode .settings-content {
  flex: 1;
  min-width: 0;
  padding: 74px 32px 64px;
  overflow: auto;
}

.settings-mode .settings-inner {
  max-width: 728px;
  margin: 0 auto;
}

.settings-mode .page-heading {
  align-items: center;
  min-height: 36px;
  margin: 0 0 44px;
}

.settings-mode .page-heading h1 {
  letter-spacing: -.4px;
  font-size: 26px;
  font-weight: 600;
  line-height: 36px;
}

.settings-mode .page-heading p {
  display: none;
}

.settings-mode .page-heading > .button {
  margin-top: 0;
}

.settings-group {
  margin-bottom: 48px;
}

.settings-group > h2 {
  margin-bottom: 16px;
  font-size: 14px;
  font-weight: 550;
  line-height: 20px;
}

.settings-card, .settings-mode .detection-list, .settings-mode .profile-list {

  padding: 0 16px;

}

.settings-mode .setting-row {

  flex-wrap: nowrap;
  gap: 22px;
  min-height: 61px;
  padding: 13px 0;
}

.settings-card .setting-row:last-child {
  border-bottom: 0;
}

.settings-mode .setting-row > div:first-child {
  flex: 1;
  min-width: 0;
}

.settings-mode .setting-row h3 {
  font-size: 13px;
  font-weight: 500;
  line-height: 19px;
}

.settings-mode .setting-row p {
  color: var(--secondary);
  margin-top: 2px;
  font-size: 12px;
  line-height: 16px;
}

.settings-mode .setting-control {
  gap: 10px;
  max-width: 48%;
  margin-left: 0;
}

.settings-mode .setting-control select, .settings-mode .button {
  border-color: var(--settings-line);
  background: #ffffff04;
  border-radius: 10px;
  min-height: 28px;
  padding: 4px 10px;
  font-size: 13px;
  line-height: 18px;
}

.settings-mode .setting-control select {
  max-width: 190px;
  padding-right: 26px;
}

.settings-mode .button.secondary:hover {
  background: var(--hover);
}

.settings-mode .button.primary {
  background: var(--primary);
  color: var(--on-primary);
}

.settings-mode .setting-path {
  white-space: nowrap;
  text-overflow: ellipsis;
  max-width: 190px;
  font-size: 12px;
  overflow: hidden;
}

.settings-mode .group-heading {
  min-height: 20px;
  margin-bottom: 16px;
}

.settings-mode .group-heading h2 {
  font-size: 14px;
  font-weight: 550;
  line-height: 20px;
}

.settings-mode .section-description {
  display: none;
}

.settings-mode .detection-row {
  border-color: var(--settings-line);
  gap: 12px;
  padding: 17px 0;
}

.settings-mode .detection-info strong {
  font-size: 13px;
  font-weight: 500;
}

.settings-mode .detection-info code {
  margin-top: 3px;
  font-size: 12px;
}

.settings-mode .tool-icon {
  background: none;
  border: 0;
  width: 30px;
  height: 30px;
}

.settings-mode .profiles-heading {
  margin-top: 48px;
}

.settings-mode .profile-row {
  border-color: var(--settings-line);
  min-height: 65px;
  padding: 14px 0;
}

.settings-mode .profile-row:last-child {
  border-bottom: 0;
}

.settings-mode .profile-main strong {
  font-size: 13px;
  font-weight: 500;
}

.settings-mode .profile-main small {
  margin-top: 3px;
  font-size: 12px;
}

.settings-mode .text-button {
  font-size: 12px;
}

.settings-mode .status {
  font-size: 11px;
}

.settings-mode .quiet-note p {
  font-size: 12px;
}

.settings-mode .toggle {
  background: #393939;
  width: 32px;
  height: 20px;
  padding: 2px;
}

.settings-mode .toggle span {
  width: 16px;
  height: 16px;
}

.settings-mode .toggle.checked {
  background: var(--accent);
}

.settings-mode .toggle.checked span {
  background: #fff;
  transform: translateX(12px);
}

.settings-mode .terminal-sample {
  background: var(--settings-card);
  border-color: var(--settings-line);
  border-radius: 16px;
}

@media (max-width: 1100px) {
  .settings-mode .settings-content {
    padding: 54px 28px 48px;
  }

  .settings-mode .setting-path {
    max-width: 130px;
  }
}

@media (max-width: 850px) {
  .settings-mode .settings-nav {
    flex-basis: 200px;
    width: 200px;
  }

  .settings-mode .settings-content {
    padding: 36px 20px 40px;
  }

  .settings-mode .setting-row {
    flex-wrap: wrap;
    gap: 10px;
  }

  .settings-mode .setting-row > div:first-child {
    flex-basis: 100%;
  }

  .settings-mode .setting-control {
    max-width: 100%;
    margin-left: auto;
  }

  .settings-mode .page-heading {
    margin-bottom: 32px;
  }

  .settings-mode .detection-row {
    flex-wrap: wrap;
  }

  .settings-mode .detection-row > .button {
    margin-left: 42px;
  }
}

:root.ydark .codex-frame:not(.settings-mode) {

  --selected: #303030;

}

.home-mode .topbar {
  display: none;
}

.reference-sidebar {

  border-right: 1px solid #ffffff08;
  padding: 0;
}

:root.ylight .reference-sidebar {

  --sidebar-foreground: #3b3e40;
  --selected: #efefef;

:root.ydark .reference-sidebar {

.reference-task-row[aria-current="page"] {

.reference-sidebar.is-collapsed {

.reference-sidebar-head {

.workspace-picker {

.workspace-picker svg {

.row-action {

.row-action:hover {

.reference-primary {

.history-count {

.reference-project-heading {

.reference-project-row:hover, .reference-task-row:hover {

.archived-tasks .nav-row {

.reference-popup {

.voice-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px; color: var(--secondary); flex-shrink: 0; font-size: 12px; }

.fw-editor-status {
  position: absolute;
  right: 16px;
  bottom: 16px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 1px;
  max-width: calc(100% - 32px);
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: .625rem;
  background: var(--bg);
  box-shadow: 0 1px 2px -1px #00000014;
  color: var(--secondary);
  font-size: 12px;
}
.fw-editor-status .fw-icon { width: 26px; height: 26px; }
.fw-editor-status-redo svg { transform: scaleX(-1); }
.fw-editor-status-mode { padding: 0 6px; white-space: nowrap; }
.fw-editor-status-saving { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; line-height: 1; }
.fw-editor-status-saving .fw-loading { width: 14px; height: 14px; flex-shrink: 0; }
.fw-editor-status-error { display: inline-flex; align-items: center; gap: 4px; color: var(--danger, #d14343); padding: 0 8px; line-height: 1; }
.fw-editor-status-error svg { flex-shrink: 0; }

/* Match the reference declarations without assuming its host palette or rem. */
@supports (color: color-mix(in lab, red, red)) {
  .fw-editor-status { background: color-mix(in oklab, var(--bg) 90%, transparent); }
}
@supports (corner-shape: superellipse(1.5)) {
  .fw-editor-status { border-radius: calc(.625rem * 1.25); }
}

/* 2026-10-17 user screenshot: recorded source/limits in the M9 reference note.
   This palette is shared by the prototype and packaged CodeMirror view. */
.file-workspace {
  --fw-code-font: "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
  --fw-code-size: 11px;
  --fw-code-line: 20px;
  --fw-code-text: #424242;
  --fw-code-keyword: #8b44ac;
  --fw-code-module: #bd3f39;
  --fw-code-string: #287b31;
  --fw-code-number: #1c64a0;
  --fw-code-comment: #858585;
  --fw-code-name: #995b23;
  --fw-code-type: #397fa2;
  --fw-code-tag: #bd3f39;
  --fw-code-meta: #747474;
}
.ydark .file-workspace, :root[data-theme="dark"] .file-workspace {
  --fw-code-text: #c9c9c9;
  --fw-code-keyword: #b87cdb;
  --fw-code-module: #fa7878;
  --fw-code-string: #7ed273;
  --fw-code-number: #75a9df;
  --fw-code-comment: #808080;
  --fw-code-name: #ff9d4d;
  --fw-code-type: #80c4dc;
  --fw-code-tag: #fa7878;
  --fw-code-meta: #a1a1a1;
}
.fw-code-keyword { color: var(--fw-code-keyword); }
.fw-code-module { color: var(--fw-code-module); }
.fw-code-string { color: var(--fw-code-string); }
.fw-code-number { color: var(--fw-code-number); }
.fw-code-comment { color: var(--fw-code-comment); }
.fw-code-name { color: var(--fw-code-name); }
.fw-code-type { color: var(--fw-code-type); }
.fw-code-tag { color: var(--fw-code-tag); }
.fw-code-meta { color: var(--fw-code-meta); }
.fw-code-deleted { color: var(--fw-code-module); }
.fw-code-inserted { color: var(--fw-code-string); }
.file-workspace .fw-md-block pre,.file-workspace .fw-md-block pre code,
.file-workspace .fa-code-block pre,.file-workspace .fa-code-block pre code,
.file-workspace .fw-md-fence pre,.file-workspace .fw-md-fence code,
.file-workspace .fw-notebook-code pre,.file-workspace .fw-notebook-code code {
  font-family:var(--fw-code-font);color:var(--fw-code-text);
}
.fw-code-overlay { position:relative;flex:1;min-width:0;min-height:0; }
.fw-editor .fw-code-overlay>pre,.fw-editor .fw-code-overlay>textarea {
  position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0 12px 24px;border:0;border-radius:0;
  font:var(--fw-code-size)/var(--fw-code-line) var(--fw-code-font);letter-spacing:normal;tab-size:4;white-space:pre;overflow:auto;
}
.fw-editor .fw-code-overlay>pre { color:var(--fw-code-text);pointer-events:none;scrollbar-width:none; }
.fw-editor .fw-code-overlay>textarea { color:transparent;caret-color:var(--text);background:transparent;resize:none;-webkit-text-fill-color:transparent; }
.fw-editor .fw-code-overlay>textarea::selection { background:var(--selected); }
.fw-editor .fw-line-numbers { font:var(--fw-code-size)/var(--fw-code-line) var(--fw-code-font);color:var(--fw-code-comment);border:0;padding:0 4px 0 8px;min-width:28px;overflow:hidden; }
/* DEV038: same public TextMate scopes and independently verified Codex palette.
   Both variants travel with each token, so theme changes never re-tokenize source. */
.file-workspace { --fw-code-text:#0d0d0d; }
.ydark .file-workspace, :root[data-theme="dark"] .file-workspace { --fw-code-text:#fcfcfc; }
.fw-code-token {
  color:var(--fw-token-light);font-style:var(--fw-token-light-style, normal);font-weight:var(--fw-token-light-weight, normal);text-decoration:var(--fw-token-light-decoration, none);
}
.ydark .fw-code-token, :root[data-theme="dark"] .fw-code-token {
  color:var(--fw-token-dark);font-style:var(--fw-token-dark-style, normal);font-weight:var(--fw-token-dark-weight, normal);text-decoration:var(--fw-token-dark-decoration, none);
}

/* Current-file Find uses the reviewed workspace selection tokens. */
.fw-production .fw-find-match,.fw-code-overlay .fw-find-match{background:var(--selected);color:inherit;font-weight:inherit}
.fw-find-current{outline:1px solid var(--border-strong);outline-offset:-1px}

.fw-line-navigation{flex-shrink:0;border-bottom:1px solid var(--border);background:var(--surface)}
.fw-line-navigation .fw-find label{font-size:12px;color:var(--secondary)}
.fw-line-navigation .fw-find input[aria-invalid=true]{outline:1px solid var(--text);outline-offset:-1px}
.fw-line-hint,.fw-line-error{font-size:11px;line-height:16px;margin:0;padding:2px 10px 6px;color:var(--secondary)}
.fw-line-error{color:var(--text);font-weight:500}

on></div></header><aside class="sidebar"></aside><div class="sidebar-resizer"></div><main class="workspace m9-task-scope"><div class="m9-workspace-split" style="--file-panel-width:900px"><div class="m6-main-body"></div><div class="m9-panel-resizer"></div><section class="file-workspace fw-production"><div class="fw-tabs">合成工作区占位</div></section></div></main></div></div><script>// Match the content width, so adjacent panels can resize without changing menu layers.
function observeTaskHeaderLayout(element, onLayout) {
  if (!element) return () => {};
  const view = element.ownerDocument.defaultView;
  if (!view) return () => {};
  const update = width => {
    if (Number.isFinite(width) && width > 0) {

    const style = view.getComputedStyle(element);
    const pixels = value => Number.parseFloat(value) || 0;
    update(element.getBoundingClientRect().width
      - pixels(style.paddingLeft) - pixels(style.paddingRight)
      - pixels(style.borderLeftWidth) - pixels(style.borderRightWidth));
  };
  measure();

    const observer = new view.ResizeObserver(entries => {
      const entry = entries.find(item => item.target === element);
      if (entry) update(entry.contentRect.width);

    return () => observer.disconnect();
  }
  view.addEventListener('resize', measure);
