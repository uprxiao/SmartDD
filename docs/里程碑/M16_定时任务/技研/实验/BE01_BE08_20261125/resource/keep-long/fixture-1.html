<!doctype html><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:#a8a8a8;overflow:hidden;font:18px system-ui}button{position:absolute;left:30px;top:30px;width:130px;height:75px}#marker{position:absolute;left:240px;top:160px;width:120px;height:95px;background:#111111}</style><button id="counter">Count 0</button><span style="position:absolute;left:200px;top:45px">Fixture 1</span><div id="marker"></div><script>window.fixtureId=1;window.documentId=String(performance.timeOrigin)+'-'+Math.random();window.clicks=0;window.ticks=0;document.querySelector("#counter").addEventListener("click",()=>{window.clicks++;document.querySelector("#counter").textContent="Count "+window.clicks;document.querySelector("#marker").style.background=["#e32636","#178847"][(window.clicks-1)%2];});setInterval(()=>window.ticks++,100);</script>
